[package]
name = "evolve2"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18", default-features = false, features = ["2d","dynamic_linking"] }
num-traits = "0.2.19"
ocl = "0.19.7"

rand = "0.10.2"
rand_distr = "0.6.0"



small_net_lib = { git = "https://github.com/angehelf/SmallNet_lib.git", version = "0.1.0" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3


